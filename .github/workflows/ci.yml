# Flujo de trabajo
name: Quality Gates

# Ejecuciones condicionadas
on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch: # Permite ejecución manual desde GitHub UI

# Cancelar ejecuciones anteriores si se hace un nuevo push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================================================================
  # JOB 1: BACKEND QUALITY GATES (PHP/Laravel)
  # ==================================================================
  backend-quality:
    name: Backend Quality (PHP)
    runs-on: ubuntu-latest

    # 👇 Agregar servicio de PostgreSQL
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing_ventas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Paso 2: Configurar PHP con las extensiones necesarias
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo, pdo_pgsql
          coverage: pcov

      # Paso 3: Garantizar el uso de las mismas dependencias
      - name: Create Cache
        uses: actions/cache@v4                         # Cache de dependencias Composer
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      # Paso 3: Instalar dependencias de PHP
      - name: Install Composer Dependencies
        run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # Paso 4: GATE 1 - Verificar estilo de código con Laravel Pint
      - name: "Gate 1: Code Style (Laravel Pint)"
        run: ./vendor/bin/pint --test

      # Paso 5: GATE 2 - Analiza el código PHP sin ejecutarlo (análisis estático) con phpstan
      - name: "Gate 2: Static Analysis (Laravel PHPStan)"
        run: ./vendor/bin/phpstan analyse app routes database

      # Paso 6: Configurar entorno para tests
      - name: Setup Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      # Paso 7: Configurar base de datos para tests
      - name: Setup Run Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: testing_ventas
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      # Paso 8: GATE 3 - Auditoría de seguridad de dependencias PHP
      - name: "Gate 3: Security Audit (Composer)"
        run: composer audit

      # Paso 9: GATE 4 - Ejecutar tests unitarios y de integración minimo coverage 80%
      - name: "Gate 4: PHPUnit Tests with Coverage"
        run: php artisan test --coverage-text --coverage-clover=coverage.xml
        env:
        #  DB_CONNECTION: sqlite
        #  DB_DATABASE: database/database.sqlite
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: testing_ventas
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  # ==================================================================
  # JOB 2: FRONTEND QUALITY GATES (JavaScript/Vue)
  # ==================================================================
  frontend-quality:
    name: Frontend Quality (JS/Vue)
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Paso 2: Configurar Node.js con cache de npm
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Paso 3: Instalar dependencias de Node.js
      - name: Install NPM Dependencies
        run: npm ci #ci producction | install develop

      # Paso 4: GATE 1 - Verificar estilo de código con ESLint
      - name: "Gate 1: Code Style (ESLint)"
        run: npm run lint

      # Paso 5: GATE 2 - Auditoría de seguridad de dependencias JS
      - name: "Gate 2: Security Audit (npm)"
        run: npm audit --audit-level=high
        continue-on-error: true # No bloquear por vulnerabilidades de baja severidad

      # Paso 6: GATE 3 - Verificar que el proyecto compila correctamente
      - name: "Gate 3: Build Verification (Vite)"
        run: npm run build

      # Paso 7: GATE 4 - Ejecutar tests de Vue con Vitest
      - name: "Gate 4: Unit Tests (Vitest)"
        run: npm run test

  # ==================================================================
  # JOB 3: RESUMEN DE RESULTADOS
  # ==================================================================
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    if: always()

    steps:
      - name: Check Results
        run: |
          echo "## Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.backend-quality.result }}" == "success" ]; then
            echo "Backend Quality: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "Backend Quality: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.frontend-quality.result }}" == "success" ]; then
            echo "Frontend Quality: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "Frontend Quality: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
